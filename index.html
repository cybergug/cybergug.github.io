---
layout: default
title: "Home"
---

<div class="container my-5">
  <!-- Header Text -->
  <div class="text-center mb-5">
    <h1 class="font-weight-bold text-dark">Welcome to My Blog</h1>
    <p class="lead text-muted">Documenting my tech journey, projects, and tutorials.</p>
  </div>

  <!-- Blog Cards Grid -->
  <div class="row">
    {% for post in site.posts %}
    <div class="col-md-4 mb-4">
      <div class="card h-100 shadow-sm">
        
        <!-- Gray Banner Placeholder -->
        <div class="bg-dark text-white text-center py-5 card-img-top" style="opacity: 0.8;">
          <small class="text-uppercase tracking-wider">Article</small>
        </div>

        <div class="card-body d-flex flex-column">
          <!-- Post Date -->
          <small class="text-muted d-block mb-2">
            {{ post.date | date: "%B %d, %Y" }}
          </small>
          
          <!-- Post Link Title -->
          <h5 class="card-title font-weight-bold">
            <a href="{{ post.url | relative_url }}" class="text-dark text-decoration-none stretched-link">
              {{ post.title }}
            </a>
          </h5>
          
          <!-- Text Excerpt Preview -->
          <p class="card-text text-secondary small flex-grow-1">
            {{ post.excerpt | strip_html | truncatewords: 20 }}
          </p>
          
          <div class="mt-3 pt-2 border-top text-primary font-weight-bold small">
            Read Article &rarr;
          </div>
        </div>

      </div>
    </div>
    {% endfor %}
  </div>
</div>
